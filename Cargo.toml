[package]
name = "mtr"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
dns-lookup = "2.0"
clap = { version = "4.5", features = ["derive"] }

# 仅在 Windows 下编译引入
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

# 仅在 Unix (Linux/macOS/iOS) 下编译引入
[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.5", features = ["all"] }