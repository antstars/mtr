name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            bin_name: mtr
            asset_name: mtr-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            bin_name: mtr
            asset_name: mtr-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            bin_name: mtr.exe
            asset_name: mtr-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
            bin_name: mtr.exe
            asset_name: mtr-windows-arm64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            bin_name: mtr
            asset_name: mtr-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            bin_name: mtr
            asset_name: mtr-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo fmt --all -- --check

      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --all-targets --locked

      - name: Run Clippy
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Install cross (Linux only)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build with cross
        if: matrix.use_cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build with cargo
        if: matrix.use_cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv ${{ matrix.bin_name }} ${{ matrix.asset_name }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sha256

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
