[package]
name = "mtr"
version = "0.1.2"
edition = "2021"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
dns-lookup = "2.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"

# 仅在 Windows 下编译引入
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

# 仅在 Unix (Linux/macOS/iOS) 下编译引入
[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.5", features = ["all"] }

# ============================================================================
# 编译优化策略 (工业级构建配置)
# ============================================================================

[profile.release]
# 开启最高级别的代码优化，提升 CPU 密集型网络包解析与校验和计算的性能
opt-level = 3

# 开启链路时优化 (Link Time Optimization)，跨 Crate 消除冗余代码，提升执行效率
lto = true

# 将所有的代码生成在一个单元中，最大化 LTO 的效果（会稍微增加编译时间，但运行时性能最优）
codegen-units = 1

# 在遇到不可恢复错误时直接中止进程，而不进行栈展开。
# 作为底层网络工具，抛出栈展开不仅没有意义，还会增加二进制体积，甚至可能暴露内部结构信息
panic = "abort"

# 自动剥离二进制文件中的调试符号，显著减小分发体积
strip = true